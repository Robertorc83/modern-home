name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet build HomeShowingScheduler.slnx -c Release
      - name: Test (unit + Testcontainers MongoDB integration)
        run: dotnet test HomeShowingScheduler.slnx -c Release --no-build --logger "console;verbosity=normal"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - name: Boot the whole stack like a reviewer would
        run: |
          cp .env.example .env
          docker compose up -d --build --wait
          curl -fsS http://localhost:5080/health
          curl -fsS -o /dev/null http://localhost:3000/login
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Browser journeys (Playwright) against the stack
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: apps/web/test-results
          if-no-files-found: ignore
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200
